services:
  crm:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - SCRAPER_SECRET=flori-secret-2024
      - N8N_CALLBACK_SECRET=flori-secret-2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/followups"]
      interval: 10s
      timeout: 5s
      retries: 10

  scraper:
    build: ./scraper
    depends_on:
      crm:
        condition: service_healthy
    environment:
      - CRM_URL=http://crm:3000
      - CRM_SECRET=flori-secret-2024
    restart: unless-stopped
